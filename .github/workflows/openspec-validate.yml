name: OpenSpec Validate

on:
  pull_request:
    paths:
      - "openspec/changes/**"
      - "src/**"
      - "tests/**"
      - "scripts/openspec_validate.py"
      - ".harness/**"
      - ".github/workflows/openspec-validate.yml"
  push:
    branches: [master]
    paths:
      - "openspec/changes/**"
      - "src/**"
      - "tests/**"
      - "scripts/openspec_validate.py"
      - ".harness/**"
      - ".github/workflows/openspec-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (隔离 venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Run OpenSpec validate (strict mode)
        run: |
          .venv/bin/python scripts/openspec_validate.py --strict

      - name: Report summary
        if: always()
        run: |
          echo "## OpenSpec validate" >> $GITHUB_STEP_SUMMARY
          echo "exit_code=$?" >> $GITHUB_STEP_SUMMARY