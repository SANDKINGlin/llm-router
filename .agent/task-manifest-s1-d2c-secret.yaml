rationale: |
  D2-C WARN Step 5 根因解 (留 P+ 切片, 8-03 D7 总归档 "已知 P+" 段第 2 条).
  8-01 三方排序里 7 切片中最后一个 D7 已 OK, D2-C WARN 是 D7 时留的 P+.
  D11.1 precedent: "修复已得三方共识 + 边界不超出 + 风险 ≤ LOW-MEDIUM = 单方 + 真验".
  风险 MEDIUM (鉴权相关, 跨 admin 4 文件), 边界明确 (改 4 文件/4 个改动点).

  真正根因 (物证三轮 trace):
    1. auth_enhanced.py:16 SECRET_KEY 硬编码 != auth.py:22/89 读 ADMIN_SECRET_KEY env
       → 双层 secret 不同源 (实际上都默认 "dev-secret-key", 但 PyJWT token 签发可能在 create_simple_token
         路径下用 SECRET_KEY 字面值, 而 AuthMiddleware._verify_token 自己 HMAC 用 secret_key;
         两者 key 字符串相等但 *代码路径不同*)
    2. /admin/auth/login 用 auth.py:generate_token() 签 2 段 token (ts:sig)
       /api/admin/users 用 require_enhanced_permission 验 3 段 token (PyJWT base64.base64.base64)
       → token 格式不兼容 → AuthMiddleware 总返 401
    3. AuthMiddleware._verify_token 只支持 2 段简化 token, 不验 PyJWT token
       → sub-app admin_app.AuthMiddleware 拦 remote + Bearer token (test_admin_auth regression 头)

  解 = 4 文件改动:
    - auth_enhanced.py: SECRET_KEY = os.environ.get("ADMIN_SECRET_KEY", "dev-secret-key")
    - app.py:68 /admin/auth/login 改用 enhanced_auth_manager.create_token() 签同源 token
    - auth.py:_verify_token: 加分支验 PyJWT token + _create_simple_token (3 段 ts:payload:sig),
      委托给 enhanced_auth_manager.verify_token
    - verify_d2c_mount_testclient.py: Step 5 WARN -> FAIL (regression 哨兵), 6/6 PASS 期望 (修复前 5+1 WARN)

