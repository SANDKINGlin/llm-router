<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLM Router Admin{% endblock %}</title>
    <script src="/static/js/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/css/admin.css">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-brand">LLM Router Admin</div>
            <div class="nav-links">
                <a href="/admin/" class="nav-link">Dashboard</a>
                <a href="/admin/keys" class="nav-link">密钥管理</a>
                <a href="/admin/monitoring" class="nav-link">监控</a>
                <a href="/admin/settings" class="nav-link">设置</a>
                <a href="/admin/backup" class="nav-link">备份</a>
            </div>
            <div class="nav-user">
                <span id="user-info">未登录</span>
            </div>
        </nav>

        <!-- 面包屑导航 -->
        <div class="breadcrumb">
            <a href="/admin/">← 返回Dashboard</a>
            {% block breadcrumb %}{% endblock %}
        </div>

        <!-- 主内容区 -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>&copy; 2026 LLM Router Admin. All rights reserved.</p>
        </footer>
    </div>

    <script src="/static/js/admin.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
