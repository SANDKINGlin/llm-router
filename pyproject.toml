[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-router"
version = "0.0.1"
description = "智能路由层(API池):聚合 LLM,按需调用,细粒度能力匹配。Phase1 能跑最小版。"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "openai>=1.0",
    "httpx>=0.27",
    "cryptography>=42",
    "pyjwt>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "pytest-asyncio>=0.21",
]

[project.scripts]
llm-router = "llm_router.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "openai>=1.0", "respx>=0.21"]
# bge 能力匹配(S2.9):真 bge-small-en-v1.5 集成测试 gated,默认 skip。
# 装:`uv pip install -e ".[bge]"` → 跑:`HF_ENDPOINT=https://hf-mirror.com BGE_INTEGRATION=1 pytest tests/unit/test_bge_encoder.py::TestRealBgeIntegration`
bge = ["sentence-transformers>=2.2"]
# Phase2+ 追加: aiosqlite(持久化) / litellm(provider适配)

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
